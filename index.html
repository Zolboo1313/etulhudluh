function short(n){
  if (n >= 1e9) return (n/1e9).toFixed(n%1e9?2:0).replace(/\.?0+$/,"") + " тэрбум₮";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + " сая₮";
  return money(n);
}

      <rect x="110" y="130" width="180" height="105" fill="${wall}"/><path d="M95 135 L200 70 L305 135Z" fill="${dark}"/>
      <rect x="130" y="155" width="40" height="35" fill="${win}"/><rect x="230" y="155" width="40" height="35" fill="${win}"/><rect x="185" y="180" width="30" height="55" fill="${dark}"/>
      ${l.type==="Хаус"?`<rect x="130" y="100" width="0" height="0"/>`:""}<rect x="0" y="235" width="400" height="6" fill="#8a7454"/>`;
  } else { // apartment / office tower
    const floors = 7 + l.id % 5;
    let wins = "";
    for (let f=0; f<floors; f++) for (let c=0; c<5; c++) wins += `<rect x="${128+c*30}" y="${255 - (f+1)*24}" width="18" height="14" fill="${(f+c+l.id)%4? win : "hsl(45 90% 75%)"}"/>`;
    body = `<rect width="400" height="300" fill="${sky1}"/><rect x="20" y="${150 - l.id%3*20}" width="80" height="200" fill="hsl(${h} 15% 78%)"/>
      <rect x="310" y="${120 + l.id%2*30}" width="70" height="200" fill="hsl(${h} 15% 74%)"/>
      <rect x="115" y="${255 - floors*24 - 12}" width="170" height="${floors*24+20}" fill="${wall}"/>${wins}
      <rect y="262" width="400" height="38" fill="hsl(${h} 10% 55%)"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/>${body.replace(/fill="hsl\(\d+ 70% \d+%\)"/, 'fill="url(#g)"')}</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const sm = p => (window.SMALL_PHOTOS && /^zurag\//.test(p)) ? p.replace(/^zurag\//, "zurag-s/") : p;   // жижиг хувилбар (зөвхөн GitHub сайтад)
const photosOf = l => (l.photos && l.photos.length) ? l.photos : [0,1,2,3].map(i => samplePhoto(l, i));

/* ---------- icons ---------- */
const ICON = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  viber: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6 2 3 4.5 3 10.5c0 3.5 1 5.6 3 6.8V21l3-2.3c1 .2 2 .3 3 .3 6 0 9-2.5 9-8.5S18 2 12 2z"/><path d="M9 8.5c.5 2.5 2 4 4.5 4.8"/></svg>',
  fb: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v7h4v-7H16l.6-4h-3.1V9c0-.6.4-1 1-1z"/></svg>'
};
const telHref = () => "tel:" + AGENT.phone.replace(/\s/g, "");
const viberHref = () => "viber://chat?number=%2B" + AGENT.viber;

/* ---------- list view ---------- */
function filtered(){
  let arr = LISTINGS.filter(l =>
    (state.deal === "Бүгд" || l.deal === state.deal) &&
    (!state.type || l.type === state.type) &&
    (!state.district || l.district === state.district) &&
    (!state.rooms || (state.rooms === 4 ? l.rooms >= 4 : l.rooms === state.rooms)));
  if (state.price) { const [a,b] = state.price.split("-").map(Number); arr = arr.filter(l => sortPrice(l) >= a && sortPrice(l) < (b || Infinity)); }
  const s = state.sort;
  arr.sort((a,b) => s === "low" ? sortPrice(a) - sortPrice(b) : s === "high" ? sortPrice(b) - sortPrice(a) : s === "big" ? (b.size||0) - (a.size||0) : b.id - a.id);
  return arr;
}
function priceOptions(){
  const sets = state.deal === "Түрээслэх" ? RENT_PRICES : state.deal === "Худалдах" ? SALE_PRICES : null;
  if (!sets) return `<option value="">Дээрээс сонгоно уу</option>`;
  return `<option value="">Бүх үнэ</option>` + sets.map(([a,b,t]) => `<option value="${a}-${b===Infinity?0:b}">${t}</option>`).join("");
}
function card(l){
  const ph = photosOf(l);
  return `<a class="card" href="#zar-${l.id}">
    <div class="ph"><img src="${sm(ph[0])}" alt="${esc(l.title)}" loading="lazy" decoding="async">
      <div class="tag"><span class="pill ${l.deal==="Түрээслэх"?"rent":"sale"}">${esc(l.deal)}</span><span class="pill">${esc(l.type)}</span>${l.sample?'<span class="pill sample">Жишээ</span>':""}</div>
      <span class="photos-n">#${l.id} · ${ph.length} зураг</span></div>
    <div class="cb">
      <div class="price">${priceLabel(l)}</div>
      ${l.price_note?`<div class="ppm">${esc(l.price_note)}</div>`:""}
      <div class="ctitle">${esc(l.title)}</div>
      <div class="loc">${ICON.pin}${esc(l.area_name)}, ${esc(l.district)}</div>
      <div class="specs">${l.units?(()=>{const u=l.units.flatMap(g=>g.rows),z=u.map(r=>r.size);return `<span><b>${u.length}</b> сонголт</span><span><b>${Math.round(Math.min(...z))}–${Math.round(Math.max(...z))}</b> м²</span>`})():""}${l.rooms?`<span><b>${l.rooms}</b> өрөө</span>`:""}${l.size?`<span><b>${l.size}</b> ${sizeUnit(l)}</span>`:""}${l.floor && l.floor!=="-"?`<span>${esc(l.floor)}${/давхар/.test(l.floor)?"":" давхар"}</span>`:""}</div>
    </div></a>`;
}
function renderList(){
  document.body.classList.remove("has-mbar");
  $("#app").innerHTML = `
  <div class="wrap">
    <section class="intro">
      <h1>Эрдэнэт хот дахь байр, хаус, газрын зарууд</h1>
      <p>Доорх шүүлтүүрээр өөрт тохирох байраа хайгаад, сонирхсон зар дээрээ дарж зураг, дэлгэрэнгүйг үзээрэй. Асуух зүйл байвал шууд залгаарай.</p>
    </section>
    <section class="filters" aria-label="Шүүлтүүр">
      <div class="deal" role="group" aria-label="Зарын төрөл">
        ${["Бүгд","Худалдах","Түрээслэх"].map(d=>`<button type="button" data-deal="${d}" aria-pressed="${state.deal===d}">${d==="Бүгд"?"Бүгд":d==="Худалдах"?"Худалдах":"Түрээс"}</button>`).join("")}
      </div>
      <div class="frow">
        <div class="field"><label for="fType">Төрөл</label><select id="fType"><option value="">Бүх төрөл</option>${TYPES.map(t=>`<option${state.type===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="fDist">Байршил</label><select id="fDist"><option value="">Бүх байршил</option>${DISTRICTS.map(t=>`<option${state.district===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="fPrice">Үнэ</label><select id="fPrice"${state.deal==="Бүгд"?" disabled":""}>${priceOptions()}</select></div>
        <div class="field"><span class="lbl" id="roomsLbl">Өрөө</span><div class="rooms" role="group" aria-labelledby="roomsLbl">
          ${[[0,"Бүгд"],[1,"1"],[2,"2"],[3,"3"],[4,"4+"]].map(([v,t])=>`<button type="button" data-rooms="${v}" aria-pressed="${state.rooms===v}">${t}</button>`).join("")}
        </div></div>
      </div>
    </section>
    <div class="fbar">
      <div class="count" id="count"></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="linkbtn" id="reset" type="button">Шүүлтүүр арилгах</button>
        <label class="sort" for="fSort">Эрэмбэ <select id="fSort">
          <option value="new">Шинэ эхэндээ</option><option value="low">Хямд нь эхэндээ</option><option value="high">Үнэтэй нь эхэндээ</option><option value="big">Том талбайтай</option>
        </select></label>
      </div>
    </div>
    <div class="grid" id="grid" style="margin-top:14px"></div>
  </div>`;
  if (state.price) $("#fPrice").value = state.price;
  $("#fSort").value = state.sort;
  $(".deal").onclick = e => { const b = e.target.closest("button"); if(!b) return; state.deal = b.dataset.deal; state.price = ""; renderList(); };
  $(".rooms").onclick = e => { const b = e.target.closest("button"); if(!b) return; state.rooms = +b.dataset.rooms; document.querySelectorAll(".rooms button").forEach(x=>x.setAttribute("aria-pressed", x===b)); drawGrid(); };
  $("#fType").onchange = e => { state.type = e.target.value; drawGrid(); };
  $("#fDist").onchange = e => { state.district = e.target.value; drawGrid(); };
  $("#fPrice").onchange = e => { state.price = e.target.value; drawGrid(); };
  $("#fSort").onchange = e => { state.sort = e.target.value; drawGrid(); };
  $("#reset").onclick = () => { Object.assign(state, {deal:"Бүгд",type:"",district:"",price:"",rooms:0,sort:"new"}); renderList(); };
  drawGrid();
}
function drawGrid(){
  const arr = filtered();
  $("#count").innerHTML = `${arr.length} зар <span>олдлоо</span>`;
  $("#grid").innerHTML = arr.length ? arr.map(card).join("") :
    `<div class="empty"><b>Ийм зар одоогоор алга байна.</b><br>Шүүлтүүрээ өөрчилж үзээрэй, эсвэл ${esc(AGENT.phone)} дугаарт залгаж хүссэн байраа хэлээрэй.</div>`;
}

/* ---------- detail view ---------- */
function renderDetail(l){
  const ph = photosOf(l); let cur = 0;
  const facts = [
    ["Төрөл", l.type], ["Зарын төрөл", l.deal],
    ["Хот", l.district], ["Байршил", l.area_name],
    l.size ? ["Талбай", `${l.size} ${sizeUnit(l)}`] : null, l.rooms ? ["Өрөө", `${l.rooms} өрөө`] : null,
    l.floor && l.floor !== "-" ? ["Давхар", l.floor] : null, l.year ? ["Ашиглалтад орсон", `${l.year} он`] : null,
    l.payment ? ["Төлбөрийн нөхцөл", l.payment] : null
  ].filter(Boolean);
  $("#app").innerHTML = `
  <div class="wrap">
    <a class="back" href="#">← Бүх зар руу буцах</a>
    <div class="detail">
      <div class="gallery">
        <div class="gmain"><img id="gimg" src="${ph[0]}" alt="${esc(l.title)}">
          ${ph.length>1?`<button class="gnav prev" type="button" aria-label="Өмнөх зураг">‹</button><button class="gnav next" type="button" aria-label="Дараагийн зураг">›</button>`:""}
          <span class="gcount" id="gcount">1 / ${ph.length}</span></div>
        <div class="thumbs">${ph.map((p,i)=>`<button type="button" data-i="${i}" aria-current="${i===0}" aria-label="Зураг ${i+1}"><img src="${sm(p)}" alt="" loading="lazy" decoding="async"></button>`).join("")}</div>
        ${l.sample?'<p class="note">Энэ бол жишээ зар. Зургууд нь бодит зураг орохоос өмнөх загвар зураг.</p>':""}
      </div>
      <div class="more">
        <div class="desc"><h2>Тайлбар</h2><p>${esc(l.description)}</p></div>
        ${l.units?`<div class="units"><h2>Зарагдах айлууд</h2>${l.units.map(g=>`<h3>${esc(g.name)}</h3><table><colgroup><col style="width:22%"><col style="width:20%"><col style="width:28%"><col></colgroup><thead><tr><th>${esc((l.units_head||[])[0]||"Тоот")}</th><th>Давхар</th><th class="num">Талбай</th><th>${esc((l.units_head||[])[1]||"Төрөл")}</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td><b>${esc(r.no)}</b></td><td>${esc(r.floor||"")}</td><td class="num">${r.size} м²</td><td>${r.kind?`<span class="kind">${esc(r.kind)}</span>`:""}</td></tr>`).join("")}</tbody></table>`).join("")}</div>`:""}
        ${l.features?.length?`<div class="feat"><h2>Онцлог</h2><ul>${l.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:""}
      </div>
      <aside class="info">
        <div class="dhead">
          <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${l.deal==="Түрээслэх"?"rent":"sale"}">${esc(l.deal)}</span><span class="pill" style="background:var(--accent-soft);color:var(--ink)">${esc(l.type)}</span></div>
          <h1>${esc(l.title)}</h1>
          <div class="loc">${ICON.pin}${esc(l.area_name)}, ${esc(l.district)}</div>
          <div class="dprice">${priceLabel(l)}</div>
          <div class="ppm">${l.price_m2 ? `1м² нь ${money(l.price_m2)}${rentSfx(l)} · нийт үнийг утсаар лавлана уу` : l.price == null ? "Үнийг утсаар лавлана уу" : money(l.price)}${l.price_note?`<br>${esc(l.price_note)}`:""}</div>
        </div>
        <dl class="facts" style="margin:0">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        ${contactBox(l)}
      </aside>
    </div>
  </div>
  <div class="mbar"><a class="btn btn-call" href="${telHref()}">${ICON.phone}${esc(AGENT.phone)}</a><a class="btn btn-viber" href="${viberHref()}">${ICON.viber}Viber</a></div>`;
  document.body.classList.add("has-mbar");
  const show = i => { cur = (i + ph.length) % ph.length; $("#gimg").src = ph[cur]; $("#gcount").textContent = `${cur+1} / ${ph.length}`;
    document.querySelectorAll(".thumbs button").forEach((b,j)=>b.setAttribute("aria-current", j===cur)); };
  $(".thumbs").onclick = e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); };
  $(".gnav.prev") && ($(".gnav.prev").onclick = () => show(cur-1));
  $(".gnav.next") && ($(".gnav.next").onclick = () => show(cur+1));
  let sx = null; const g = $(".gmain");
  g.addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
  g.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
  bindCopy();
  window.scrollTo(0,0);
}
function contactBox(l){
  return `<div class="contact">
    <div class="agent"><div class="avatar">${esc(AGENT.name[0])}</div><div><b>${esc(AGENT.name)}</b><span>${esc(AGENT.title)}</span></div></div>
    <div class="phone"><strong>${esc(AGENT.phone)}</strong><button class="copy" type="button" data-copy="${esc(AGENT.phone)}">Хуулах</button></div>
    <div class="cta">
      <a class="btn btn-call" href="${telHref()}">${ICON.phone}Залгах</a>
      <div class="cta2"><a class="btn btn-viber" href="${viberHref()}">${ICON.viber}Viber</a><a class="btn btn-fb" href="${esc(AGENT.facebook)}" target="_blank" rel="noopener">${ICON.fb}Facebook</a></div>
    </div>
    <p class="note">Залгах товч ажиллахгүй бол дээрх дугаарыг хуулж аваад залгана уу.</p>
    <p class="note">Залгахдаа <b>зарын дугаар #${l.id}</b> гэж хэлбэл таны сонирхсон байрыг шууд мэднэ.</p>
  </div>`;
}
function bindCopy(){
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Хуулсан"; }
    catch { const s = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Сонгосон"; }
    setTimeout(()=> b.textContent = "Хуулах", 1800);
  });
}

/* ---------- router ---------- */
function route(){
  const m = location.hash.match(/^#zar-(\d+)$/);
  const l = m && LISTINGS.find(x => x.id === +m[1]);
  l ? renderDetail(l) : renderList();
}
function initChrome(){
  $("#agentTag").textContent = AGENT.title;
  $("#topPhone").textContent = AGENT.phone;
  $("#topCall").href = telHref();
  $("#yr").textContent = new Date().getFullYear();
  $("#footAgent").textContent = AGENT.name + ", " + AGENT.title.toLowerCase();
  $("#footContact").textContent = "Утас: " + AGENT.phone;
}
window.addEventListener("hashchange", route);
initChrome(); route();
</script>

</body>
</html>
